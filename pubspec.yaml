name: puj_dispatch_system
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  

  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  google_maps_flutter: ^2.18.0
  provider: ^6.1.5+1
